#p-reveal{background:var(--cream)!important;border:4px solid var(--red-dark)!important;border-radius:12px!important}

  #p-host-final .final-podium{position:relative!important;inset:auto!important;width:94%!important;height:auto!important}
  #p-host-final .fpod{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important}

/* V27B — cartes de réponses compactes : blocs carrés / rectangles, pas de grandes étiquettes */

  justify-content:center!important;
}
#p-host-q .mock-cards{
  flex:0 0 auto!important;
  height:auto!important;
  width:100%!important;
  align-items:stretch!important;
  grid-auto-rows:auto!important;
}
#p-host-q .mock-card{
  height:auto!important;
  aspect-ratio:0.96 / 1!important;
  min-height:0!important;
  max-height:390px!important;
  display:grid!important;
  grid-template-rows:minmax(0,72%) minmax(72px,28%)!important;
}
#p-host-q .mock-card-img{
  min-height:0!important;
  height:100%!important;
}

   Goal: compact answer cards, clear timer, no dead side column. */

  grid-template-columns:minmax(0,1fr) minmax(210px,18vw)!important;

  align-items:center!important;
  justify-content:flex-start!important;

  border:2px solid #E8D6B8!important;
  box-shadow:0 7px 20px rgba(70,40,20,.08)!important;
